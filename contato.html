<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato conosco! Envie suas dúvidas, sugestões ou opiniões sobre o mini-site de The Last of Us Part II através do nosso formulário.">
    <meta name="author" content="Gabriel Lucas">

    <title>The Last of Us Part II - Contato</title>

    <link rel="stylesheet" href="contato.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap">
</head>
<body>
    <header>

        <div class="logo">
            <a href="index.html">
            <img src="images/vagalumes2.png" alt="Logo do jogo The Last Of Us Part II.">
            <span>The Last Of Us Part II</span>
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <h1>Fale Conosco</h1>

        <section>

            <h2>Entre em Contato</h2>

            <p>Preencha o formulário abaixo para enviar suas dúvidas, sugestões ou opiniões sobre o jogo e o nosso site.</p>

            <form method="post">
                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </p>

                <p>
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto da mensagem" required>
                </p>

                <p>
                    <label for="categoria">Categoria:</label><br>
                    <select id="categoria" name="categoria" required>
                        <option value="">-- Selecione uma categoria --</option>
                        <option value="duvida">Dúvida</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="critica">Crítica</option>
                        <option value="outro">Outro</option>
                    </select>
                </p>

                <p>
                    <label for="comentario">Comentário:</label><br>
                    <textarea id="comentario" name="comentario" rows="6" cols="40" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </p>

                <p>
                    <button type="submit">Enviar Mensagem</button>
                </p>
            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Mini Site de Jogos Eletrônicos</p>
    </footer>
    
</body>
</html>
